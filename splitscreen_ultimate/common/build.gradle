architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Compile against NeoForge 1.21.1's annotation format. New Fabric Mixin emits an array for
    // Redirect.at; NeoForge's bundled MixinExtras 0.5.3 expects the older single annotation.
    compileOnly 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
    modImplementation("tsapper.simple_controller_support:simple_controller_support-common:$rootProject.controller_support_version") { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

tasks.named('test') { useJUnitPlatform() }

configurations.compileClasspath.resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.15.2+mixin.0.8.7'
